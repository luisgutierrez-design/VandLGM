<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Tienes un minuto?</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%92%96%3C/text%3E%3C/svg%3E">
    <style>
        /* Estilos generales con vibra estética y limpia */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #2e1220 0%, #0c0610 45%, #000000 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Corazones flotantes decorativos de fondo */
        .corazon-bg {
            position: absolute;
            top: -12vh;
            color: rgba(255, 91, 153, 0.44);
            font-size: 30px;
            user-select: none;
            pointer-events: none;
            animation: flotar 7s linear infinite;
            filter: drop-shadow(0 0 18px rgba(255, 91, 153, 0.45));
        }

        @keyframes flotar {
            0% { transform: translate3d(0, 0, 0) scale(0.65); opacity: 0; }
            25% { transform: translate3d(var(--drift), 18vh, 0) scale(0.9); opacity: 0.8; }
            55% { transform: translate3d(calc(var(--drift) * 0.5), 50vh, 0) scale(1.0); opacity: 0.85; }
            85% { transform: translate3d(calc(var(--drift) * 0.2), 85vh, 0) scale(1.1); opacity: 0.7; }
            100% { transform: translate3d(calc(var(--drift) * 0.1), 110vh, 0) scale(1.25); opacity: 0; }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: all 0.5s ease;
            z-index: 10;
        }

        h2 {
            color: #ff4d6d;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #ffb3c1;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
            text-align: center;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #ff4d6d;
            box-shadow: 0 0 8px rgba(255, 77, 109, 0.2);
        }

        button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        button:hover {
            background: #ff758f;
            transform: translateY(-2px);
        }

        /* Estilos de los botones de la pregunta secreta */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            height: 50px;
        }

        .btn-pregunta {
            width: 100px;
            position: absolute;
        }

        #btn-si {
            left: calc(50% - 110px);
            background-color: #4ceda2;
        }
        #btn-si:hover { background-color: #2ecc71; }

        #btn-no {
            right: calc(50% - 110px);
            background-color: #ff4d6d;
            transition: all 0.1s ease;
        }

        /* ESTILOS DEL SEGUNDO PASO (FORMULARIO CITA) */
        .form-cita {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            align-items: center;
        }

        .img-pelicula {
            width: 100%;
            max-width: 260px;
            height: auto;
            aspect-ratio: 380 / 562;
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            margin: 0 auto 18px;
            display: block;
        }

        .input-cita {
            width: 100%;
            max-width: 280px;
            padding: 10px 15px;
            border: 2px solid #ffb3c1;
            border-radius: 20px;
            outline: none;
            font-size: 15px;
            color: #555;
            text-align: center;
            background-color: #fff;
            transition: 0.3s;
        }

        .input-cita:focus {
            border-color: #ff4d6d;
            box-shadow: 0 0 8px rgba(255, 77, 109, 0.2);
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h2>Escribe tu nombre</h2>
        <div class="input-group">
            <input type="text" id="nombre-usuario" placeholder="Escribe tu nombre" autocomplete="off">
        </div>
        <button onclick="verificarNombre()">Ingresar</button>
    </div>

    <script>
        // Cambia esto por tu número real de WhatsApp (con código de país, ej: 58 para Venezuela)
        const miTelefono = "584125173073"; 
        let nombreGuardado = "";

        // Generar corazones flotantes de fondo automáticamente
        for (let i = 0; i < 15; i++) {
            let corazon = document.createElement('div');
            corazon.className = 'corazon-bg';
            corazon.innerText = '❤️';
            corazon.style.left = 5 + Math.random() * 90 + 'vw';
            corazon.style.setProperty('--drift', `${Math.random() * 60 - 30}px`);
            corazon.style.animationDelay = Math.random() * 4 + 's';
            corazon.style.animationDuration = 6 + Math.random() * 6 + 's';
            corazon.style.fontSize = Math.random() * 26 + 18 + 'px';
            document.body.appendChild(corazon);
        }

        // Paso 1: Procesar el Login
        function verificarNombre() {
            const nombre = document.getElementById('nombre-usuario').value.trim();
            
            if (nombre === "") {
                alert("¡Oye! No puedes dejar el nombre vacío 😊");
                return;
            }

            if (nombre.toLowerCase() !== 'valentina') {
                alert("Solo Valentina puede continuar aquí.");
                return;
            }

            nombreGuardado = nombre;

            // Cambiamos a la pregunta
            const card = document.getElementById('main-card');
            card.innerHTML = `
                <h2>¡Hola, ${nombre}! ✨</h2>
                <p style="color: #666; margin-bottom: 20px; font-size: 18px;">
                    Me preguntaba si... <br><b>¿Quieres ver una película conmigo? 🎬</b>
                </p>
                <div class="btn-container">
                    <button id="btn-si" class="btn-pregunta" onclick="mostrarFormularioCita()">SÍ</button>
                    <button id="btn-no" class="btn-pregunta" onmouseover="escaparBoton()" onclick="escaparBoton()">NO</button>
                </div>
            `;
        }

        // Lógica del botón travieso
        function escaparBoton() {
            const btnNo = document.getElementById('btn-no');
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 20);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        }

        // Paso 2: Mostrar pantalla de detalles con diseño pulido
        function mostrarFormularioCita() {
            const card = document.getElementById('main-card');
            card.innerHTML = `
                <h2 style="font-size: 22px;">¡Perfecto! Vamos a ver...</h2>
                
                <img class="img-pelicula" src="https://m.media-amazon.com/images/M/MV5BYzM0MDI3MjQtZTc0MC00YzNlLWExYjUtNjFlOTg3NmI5ZWUyXkEyXkFqcGc@._V1_QL75_UX380_CR0,12,380,562_.jpg" alt="Las ventajas de ser invisible" onerror="this.onerror=null; this.src='https://i.imgur.com/2Qm6Y0z.jpg'">
                
                <h3 style="color: #333; font-size: 16px; margin-bottom: 20px;">Las ventajas de ser invisible</h3>
                
                <div class="form-cita">
                    <input type="date" class="input-cita" id="fecha-cita">
                    <input type="time" class="input-cita" id="hora-cita">
                    <input type="text" class="input-cita" id="ubicacion-cita" placeholder="Ubicación o cine">
                    <input type="email" class="input-cita" id="correo-cita" placeholder="Tu correo para recordatorio">
                    
                    <button style="margin-top: 10px;" onclick="enviarConfirmacionFinal()">Confirmar cita</button>
                </div>
            `;
        }

        // Paso 3: Enviar variables a WhatsApp
        function enviarConfirmacionFinal() {
            const fecha = document.getElementById('fecha-cita').value;
            const hora = document.getElementById('hora-cita').value;
            const ubicacion = document.getElementById('ubicacion-cita').value.trim();

            if (!fecha || !hora || !ubicacion) {
                alert("Por favor llena la fecha, hora y el cine para agendarlo de una vez 💕");
                return;
            }

            // Formatear la fecha a algo más bonito
            const partesFecha = fecha.split("-");
            const fechaBonita = `${partesFecha[2]}/${partesFecha[1]}/${partesFecha[0]}`;

            // Armar texto para WhatsApp
            const textoMensaje = `¡Hola! Soy ${nombreGuardado}. ¡Acepto la cita para ver Las ventajas de ser invisible! 🎬✨\n\n📅 Fecha: ${fechaBonita}\n⏰ Hora: ${hora}\n🍿 Lugar: ${ubicacion}`;
            const mensajeEncriptado = encodeURIComponent(textoMensaje);
            
            alert("¡Confirmado! Te estoy redirigiendo para enviarme los detalles de la cita por WhatsApp 💌");
            
            // Abrir chat
            window.location.href = `https://wa.me/${miTelefono}?text=${mensajeCompressed = mensajeEncriptado}`;
        }
    </script>

</body>
</html>
